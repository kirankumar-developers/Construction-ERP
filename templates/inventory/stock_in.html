{% extends "base.html" %}

{% block title %}Stock In - Construction ERP{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="h3">Record Stock Receipt (Stock In)</h1>
    <p class="text-muted">Manually enter material arrivals at site warehouses</p>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="table-card">
            <form method="POST" action="{{ url_for('materials.stock_in') }}">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="material_id" class="form-label">Material Item</label>
                        <select name="material_id" id="material_id" class="form-select" required>
                            <option value="">Select Material</option>
                            {% for m in materials %}
                            <option value="{{ m._id }}">{{ m.name }} ({{ m.material_code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-12">
                        <label for="project_id" class="form-label">Project</label>
                        <select name="project_id" id="project_id" class="form-select" required>
                            <option value="">Select Project</option>
                            {% for p in projects %}
                            <option value="{{ p._id }}">{{ p.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-12">
                        <label for="site_id" class="form-label">Site Assignment</label>
                        <select name="site_id" id="site_id" class="form-select" required>
                            <option value="">Select Site</option>
                            {% for s in sites %}
                            <option value="{{ s._id }}">{{ s.name }} ({{ s.site_code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="warehouse_name" class="form-label">Warehouse Name</label>
                        <input type="text" name="warehouse_name" id="warehouse_name" class="form-control" value="Main Warehouse" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="quantity" class="form-label">Quantity</label>
                        <input type="number" step="0.01" name="quantity" id="quantity" class="form-control" placeholder="0" required>
                    </div>
                    
                    <div class="col-md-12 text-end mt-4">
                        <a href="{{ url_for('materials.index') }}" class="btn btn-outline-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Process Stock In</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
