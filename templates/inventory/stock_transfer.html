{% extends "base.html" %}

{% block title %}Stock Transfer - Construction ERP{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="h3">Material Stock Transfer</h1>
    <p class="text-muted">Move inventory stock between different project site warehouses</p>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="table-card">
            <form method="POST" action="{{ url_for('materials.stock_transfer') }}">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="material_id" class="form-label">Material Item</label>
                        <select name="material_id" id="material_id" class="form-select" required>
                            <option value="">Select Material</option>
                            {% for m in materials %}
                            <option value="{{ m._id }}">{{ m.name }} ({{ m.material_code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-6 border-end pe-3">
                        <h5 class="mb-3 border-bottom pb-2">From Site (Source)</h5>
                        <div class="mb-3">
                            <label for="from_project_id" class="form-label">Project</label>
                            <select name="from_project_id" id="from_project_id" class="form-select" required>
                                <option value="">Select Project</option>
                                {% for p in projects %}
                                <option value="{{ p._id }}">{{ p.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="from_site_id" class="form-label">Site</label>
                            <select name="from_site_id" id="from_site_id" class="form-select" required>
                                <option value="">Select Site</option>
                                {% for s in sites %}
                                <option value="{{ s._id }}">{{ s.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-6 ps-3">
                        <h5 class="mb-3 border-bottom pb-2">To Site (Destination)</h5>
                        <div class="mb-3">
                            <label for="to_project_id" class="form-label">Project</label>
                            <select name="to_project_id" id="to_project_id" class="form-select" required>
                                <option value="">Select Project</option>
                                {% for p in projects %}
                                <option value="{{ p._id }}">{{ p.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="to_site_id" class="form-label">Site</label>
                            <select name="to_site_id" id="to_site_id" class="form-select" required>
                                <option value="">Select Site</option>
                                {% for s in sites %}
                                <option value="{{ s._id }}">{{ s.name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                    </div>
                    
                    <div class="col-md-12 border-top pt-3">
                        <label for="quantity" class="form-label">Quantity to Transfer</label>
                        <input type="number" step="0.01" name="quantity" id="quantity" class="form-control" placeholder="0" required>
                    </div>
                    
                    <div class="col-md-12 text-end mt-4">
                        <a href="{{ url_for('materials.index') }}" class="btn btn-outline-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Process Transfer</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
