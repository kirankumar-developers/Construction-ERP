{% extends "base.html" %}

{% block title %}Create Indent - Construction ERP{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="h3">Raise Material Indent (Requisition)</h1>
    <p class="text-muted">Submit material request list for project site approval</p>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="table-card">
            <form method="POST" action="{{ url_for('procurement.add_request') }}">
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="site_id" class="form-label">Site Assignment</label>
                        <select name="site_id" id="site_id" class="form-select" required>
                            <option value="">Select Site</option>
                            {% for s in sites %}
                            <option value="{{ s._id }}">{{ s.name }} ({{ s.site_code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="required_date" class="form-label">Required Date</label>
                        <input type="date" name="required_date" id="required_date" class="form-control" required>
                    </div>
                </div>
                
                <h5 class="mb-3 border-bottom pb-2">Requested Material Items</h5>
                <div id="itemsContainer">
                    <div class="row g-2 mb-3 item-row">
                        <div class="col-md-6">
                            <select name="material_id[]" class="form-select" required>
                                <option value="">Select Material</option>
                                {% for m in materials %}
                                <option value="{{ m._id }}">{{ m.name }} ({{ m.unit }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-5">
                            <input type="number" step="0.01" name="quantity[]" class="form-control" placeholder="Quantity needed" required>
                        </div>
                        <div class="col-md-1">
                            <button type="button" class="btn btn-outline-danger w-100" onclick="removeRow(this)"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                </div>
                
                <button type="button" class="btn btn-outline-secondary btn-sm mb-4" onclick="addRow()"><i class="bi bi-plus"></i> Add Item Row</button>
                
                <div class="text-end">
                    <a href="{{ url_for('procurement.index') }}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">Submit Requisition</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function addRow() {
        var container = document.getElementById('itemsContainer');
        var row = document.createElement('div');
        row.className = 'row g-2 mb-3 item-row';
        row.innerHTML = `
            <div class="col-md-6">
                <select name="material_id[]" class="form-select" required>
                    <option value="">Select Material</option>
                    {% for m in materials %}
                    <option value="{{ m._id }}">{{ m.name }} (${m.unit})</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-5">
                <input type="number" step="0.01" name="quantity[]" class="form-control" placeholder="Quantity needed" required>
            </div>
            <div class="col-md-1">
                <button type="button" class="btn btn-outline-danger w-100" onclick="removeRow(this)"><i class="bi bi-trash"></i></button>
            </div>
        `;
        container.appendChild(row);
    }
    
    function removeRow(button) {
        button.closest('.item-row').remove();
    }
</script>
{% endblock %}
