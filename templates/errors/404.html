{% extends "base.html" %}

{% block title %}Page Not Found - 404{% endblock %}

{% block content %}
<div class="text-center py-5">
    <i class="bi bi-question-circle fs-1 text-secondary d-block mb-3"></i>
    <h1 class="display-5">404 - Page Not Found</h1>
    <p class="lead text-muted">The page you are looking for does not exist or has been moved.</p>
    <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary mt-3">Back to Dashboard</a>
</div>
{% endblock %}
