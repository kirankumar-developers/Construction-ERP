{% extends "base.html" %}

{% block title %}Create BOQ - Construction ERP{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="h3">Create Bill of Quantities (BOQ)</h1>
    <p class="text-muted">Register structural items and materials rate estimates</p>
</div>

<div class="row">
    <div class="col-md-10">
        <div class="table-card">
            <form method="POST" action="{{ url_for('boq.add') }}">
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="project_id" class="form-label">Project</label>
                        <select name="project_id" id="project_id" class="form-select" required>
                            <option value="">Select Project</option>
                            {% for p in projects %}
                            <option value="{{ p._id }}">{{ p.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="category" class="form-label">BOQ Category</label>
                        <input type="text" name="category" id="category" class="form-control" placeholder="Civil Work / Electrical / Plumbing" required>
                    </div>
                </div>
                
                <h5 class="mb-3 border-bottom pb-2">BOQ Items</h5>
                <div id="itemsContainer">
                    <div class="row g-2 mb-3 item-row">
                        <div class="col-md-5">
                            <input type="text" name="description[]" class="form-control" placeholder="Item Description (e.g. Concrete M25)" required>
                        </div>
                        <div class="col-md-2">
                            <input type="text" name="unit[]" class="form-control" placeholder="Unit (e.g. Cum)" required>
                        </div>
                        <div class="col-md-2">
                            <input type="number" step="0.01" name="quantity[]" class="form-control qty-input" placeholder="Qty" required onchange="calculateAmounts()">
                        </div>
                        <div class="col-md-2">
                            <input type="number" step="0.01" name="rate[]" class="form-control rate-input" placeholder="Rate" required onchange="calculateAmounts()">
                        </div>
                        <div class="col-md-1">
                            <button type="button" class="btn btn-outline-danger w-100" onclick="removeRow(this)"><i class="bi bi-trash"></i></button>
                        </div>
                    </div>
                </div>
                
                <button type="button" class="btn btn-outline-secondary btn-sm mb-4" onclick="addRow()"><i class="bi bi-plus"></i> Add Item Row</button>
                
                <div class="row justify-content-end mb-4 border-top pt-3">
                    <div class="col-md-4 text-end">
                        <h4>Total BOQ Value: $<span id="totalBOQ">0.00</span></h4>
                    </div>
                </div>
                
                <div class="text-end">
                    <a href="{{ url_for('boq.index') }}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">Create BOQ</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    function addRow() {
        var container = document.getElementById('itemsContainer');
        var row = document.createElement('div');
        row.className = 'row g-2 mb-3 item-row';
        row.innerHTML = `
            <div class="col-md-5">
                <input type="text" name="description[]" class="form-control" placeholder="Item Description" required>
            </div>
            <div class="col-md-2">
                <input type="text" name="unit[]" class="form-control" placeholder="Unit" required>
            </div>
            <div class="col-md-2">
                <input type="number" step="0.01" name="quantity[]" class="form-control qty-input" placeholder="Qty" required onchange="calculateAmounts()">
            </div>
            <div class="col-md-2">
                <input type="number" step="0.01" name="rate[]" class="form-control rate-input" placeholder="Rate" required onchange="calculateAmounts()">
            </div>
            <div class="col-md-1">
                <button type="button" class="btn btn-outline-danger w-100" onclick="removeRow(this)"><i class="bi bi-trash"></i></button>
            </div>
        `;
        container.appendChild(row);
    }
    
    function removeRow(button) {
        var row = button.closest('.item-row');
        row.remove();
        calculateAmounts();
    }
    
    function calculateAmounts() {
        var qtys = document.getElementsByClassName('qty-input');
        var rates = document.getElementsByClassName('rate-input');
        var total = 0;
        for (var i = 0; i < qtys.length; i++) {
            var q = parseFloat(qtys[i].value) || 0;
            var r = parseFloat(rates[i].value) || 0;
            total += q * r;
        }
        document.getElementById('totalBOQ').innerText = total.toFixed(2);
    }
</script>
{% endblock %}
