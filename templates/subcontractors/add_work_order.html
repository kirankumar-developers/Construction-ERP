{% extends "base.html" %}

{% block title %}Create Work Order - Construction ERP{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="h3">Create Work Order</h1>
    <p class="text-muted">Issue a new construction agreement contract</p>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="table-card">
            <form method="POST" action="{{ url_for('subcontractors.add_work_order') }}">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="subcontractor_id" class="form-label">Subcontractor</label>
                        <select name="subcontractor_id" id="subcontractor_id" class="form-select" required>
                            <option value="">Select Subcontractor</option>
                            {% for sub in subcontractors %}
                            <option value="{{ sub._id }}">{{ sub.company_name }} ({{ sub.work_category }})</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-12">
                        <label for="project_id" class="form-label">Project</label>
                        <select name="project_id" id="project_id" class="form-select" required>
                            <option value="">Select Project</option>
                            {% for p in projects %}
                            <option value="{{ p._id }}">{{ p.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-12">
                        <label for="site_id" class="form-label">Site Assignment</label>
                        <select name="site_id" id="site_id" class="form-select" required>
                            <option value="">Select Site</option>
                            {% for s in sites %}
                            <option value="{{ s._id }}">{{ s.name }} ({{ s.site_code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-12">
                        <label for="description" class="form-label">Work Scope Description</label>
                        <input type="text" name="description" id="description" class="form-control" placeholder="Piping layout block B / Brick layout layer 1" required>
                    </div>

                    <div class="col-md-12">
                        <label for="contract_amount" class="form-label">Contract Amount ($)</label>
                        <input type="number" step="0.01" name="contract_amount" id="contract_amount" class="form-control" placeholder="0.00" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="start_date" class="form-label">Start Date</label>
                        <input type="date" name="start_date" id="start_date" class="form-control" required>
                    </div>

                    <div class="col-md-6">
                        <label for="end_date" class="form-label">End Date</label>
                        <input type="date" name="end_date" id="end_date" class="form-control" required>
                    </div>
                    
                    <div class="col-md-12 text-end mt-4">
                        <a href="{{ url_for('subcontractors.work_orders') }}" class="btn btn-outline-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Create Work Order</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
