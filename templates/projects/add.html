{% extends "base.html" %}

{% block title %}Create Project - Construction ERP{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="h3">Create Project</h1>
    <p class="text-muted">Register a new construction contract</p>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="table-card">
            <form method="POST" action="{{ url_for('projects.add') }}">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="name" class="form-label">Project Name</label>
                        <input type="text" name="name" id="name" class="form-control" placeholder="Project Name" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="client_id" class="form-label">Client</label>
                        <select name="client_id" id="client_id" class="form-select">
                            <option value="">Select Client</option>
                            {% for c in clients %}
                            <option value="{{ c._id }}">{{ c.company_name }} ({{ c.client_name }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="manager_id" class="form-label">Project Manager</label>
                        <select name="manager_id" id="manager_id" class="form-select" required>
                            <option value="">Select Manager</option>
                            {% for m in managers %}
                            <option value="{{ m._id }}">{{ m.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-12">
                        <label for="address" class="form-label">Project Address</label>
                        <input type="text" name="address" id="address" class="form-control" placeholder="Select on map or type here">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="lat" class="form-label">Latitude</label>
                        <input type="text" name="lat" id="lat" class="form-control" placeholder="0.0" readonly>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="lng" class="form-label">Longitude</label>
                        <input type="text" name="lng" id="lng" class="form-control" placeholder="0.0" readonly>
                    </div>

                    <div class="col-md-6">
                        <label for="start_date" class="form-label">Start Date</label>
                        <input type="date" name="start_date" id="start_date" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label for="end_date" class="form-label">End Date</label>
                        <input type="date" name="end_date" id="end_date" class="form-control">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="budget" class="form-label">Total Budget ($)</label>
                        <input type="number" step="0.01" name="budget" id="budget" class="form-control" placeholder="0.00">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="priority" class="form-label">Project Priority</label>
                        <select name="priority" id="priority" class="form-select">
                            {% for p in ProjectPriority.ALL %}
                            <option value="{{ p }}">{{ p.title() }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-12">
                        <label for="description" class="form-label">Description</label>
                        <textarea name="description" id="description" class="form-control" rows="3" placeholder="Scope details"></textarea>
                    </div>
                    
                    <div class="col-md-12">
                        <div id="map" class="map-container-small"></div>
                        <small class="text-muted">Click on the map to pin the project location coordinates.</small>
                    </div>
                    
                    <div class="col-md-12 text-end">
                        <a href="{{ url_for('projects.index') }}" class="btn btn-outline-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Create Project</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var map = L.map('map').setView([20.5937, 78.9629], 5); // India center by default or typical defaults
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        
        var marker;
        
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            
            document.getElementById('lat').value = lat.toFixed(6);
            document.getElementById('lng').value = lng.toFixed(6);
            
            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }
        });
    });
</script>
{% endblock %}
