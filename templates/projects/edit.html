{% extends "base.html" %}

{% block title %}Edit Project - Construction ERP{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="h3">Edit Project - {{ project.name }}</h1>
    <p class="text-muted">Modify project parameters and completion progress</p>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="table-card">
            <form method="POST" action="{{ url_for('projects.edit', project_id=project._id) }}">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="name" class="form-label">Project Name</label>
                        <input type="text" name="name" id="name" class="form-control" value="{{ project.name }}" required>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="client_id" class="form-label">Client</label>
                        <select name="client_id" id="client_id" class="form-select">
                            <option value="">Select Client</option>
                            {% for c in clients %}
                            <option value="{{ c._id }}" {% if project.client_id == c._id %}selected{% endif %}>{{ c.company_name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="manager_id" class="form-label">Project Manager</label>
                        <select name="manager_id" id="manager_id" class="form-select" required>
                            <option value="">Select Manager</option>
                            {% for m in managers %}
                            <option value="{{ m._id }}" {% if project.manager_id == m._id %}selected{% endif %}>{{ m.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-12">
                        <label for="address" class="form-label">Project Address</label>
                        <input type="text" name="address" id="address" class="form-control" value="{{ project.location.address }}" placeholder="Address">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="lat" class="form-label">Latitude</label>
                        <input type="text" name="lat" id="lat" class="form-control" value="{{ project.location.lat }}" readonly>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="lng" class="form-label">Longitude</label>
                        <input type="text" name="lng" id="lng" class="form-control" value="{{ project.location.lng }}" readonly>
                    </div>

                    <div class="col-md-6">
                        <label for="start_date" class="form-label">Start Date</label>
                        <input type="date" name="start_date" id="start_date" class="form-control" value="{{ project.start_date }}">
                    </div>

                    <div class="col-md-6">
                        <label for="end_date" class="form-label">End Date</label>
                        <input type="date" name="end_date" id="end_date" class="form-control" value="{{ project.end_date }}">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="budget" class="form-label">Total Budget ($)</label>
                        <input type="number" step="0.01" name="budget" id="budget" class="form-control" value="{{ project.budget }}">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="progress" class="form-label">Progress Completion (%)</label>
                        <input type="number" name="progress" id="progress" class="form-control" value="{{ project.progress }}" min="0" max="100">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="status" class="form-label">Project Status</label>
                        <select name="status" id="status" class="form-select">
                            {% for s in ProjectStatus.ALL %}
                            <option value="{{ s }}" {% if project.status == s %}selected{% endif %}>{{ s.upper() }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-6">
                        <label for="priority" class="form-label">Project Priority</label>
                        <select name="priority" id="priority" class="form-select">
                            {% for p in ProjectPriority.ALL %}
                            <option value="{{ p }}" {% if project.priority == p %}selected{% endif %}>{{ p.title() }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-12">
                        <label for="description" class="form-label">Description</label>
                        <textarea name="description" id="description" class="form-control" rows="3">{{ project.description }}</textarea>
                    </div>
                    
                    <div class="col-md-12">
                        <div id="map" class="map-container-small"></div>
                        <small class="text-muted">Click on the map to modify the location pin.</small>
                    </div>
                    
                    <div class="col-md-12 text-end">
                        <a href="{{ url_for('projects.view', project_id=project._id) }}" class="btn btn-outline-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var defaultLat = {{ project.location.lat or 20.5937 }};
        var defaultLng = {{ project.location.lng or 78.9629 }};
        
        var map = L.map('map').setView([defaultLat, defaultLng], 10);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        
        var marker = L.marker([defaultLat, defaultLng]).addTo(map);
        
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            
            document.getElementById('lat').value = lat.toFixed(6);
            document.getElementById('lng').value = lng.toFixed(6);
            
            marker.setLatLng(e.latlng);
        });
    });
</script>
{% endblock %}
