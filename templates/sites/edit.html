{% extends "base.html" %}

{% block title %}Edit Site - Construction ERP{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="h3">Edit Construction Site - {{ site.name }}</h1>
    <p class="text-muted">Modify parameters and assignments</p>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="table-card">
            <form method="POST" action="{{ url_for('sites.edit', site_id=site._id) }}">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="name" class="form-label">Site Name</label>
                        <input type="text" name="name" id="name" class="form-control" value="{{ site.name }}" required>
                    </div>
                    
                    <div class="col-md-12">
                        <label for="project_id" class="form-label">Project Assignment</label>
                        <select name="project_id" id="project_id" class="form-select" required>
                            {% for p in projects %}
                            <option value="{{ p._id }}" {% if site.project_id == p._id %}selected{% endif %}>{{ p.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-12">
                        <label for="address" class="form-label">Site Address</label>
                        <input type="text" name="address" id="address" class="form-control" value="{{ site.address }}">
                    </div>
                    
                    <div class="col-md-6">
                        <label for="lat" class="form-label">Latitude</label>
                        <input type="text" name="lat" id="lat" class="form-control" value="{{ site.lat }}" readonly>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="lng" class="form-label">Longitude</label>
                        <input type="text" name="lng" id="lng" class="form-control" value="{{ site.lng }}" readonly>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="engineer_id" class="form-label">Site Engineer</label>
                        <select name="engineer_id" id="engineer_id" class="form-select" required>
                            {% for e in engineers %}
                            <option value="{{ e._id }}" {% if site.engineer_id == e._id %}selected{% endif %}>{{ e.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="supervisor_id" class="form-label">Supervisor</label>
                        <select name="supervisor_id" id="supervisor_id" class="form-select">
                            <option value="">Select Supervisor</option>
                            {% for s in supervisors %}
                            <option value="{{ s._id }}" {% if site.supervisor_id == s._id %}selected{% endif %}>{{ s.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-6">
                        <label for="status" class="form-label">Site Status</label>
                        <select name="status" id="status" class="form-select">
                            {% for s in SiteStatus.ALL %}
                            <option value="{{ s }}" {% if site.status == s %}selected{% endif %}>{{ s.upper() }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-12">
                        <div id="map" class="map-container-small"></div>
                        <small class="text-muted">Click on the map to modify coordinates.</small>
                    </div>
                    
                    <div class="col-md-12 text-end">
                        <a href="{{ url_for('sites.index') }}" class="btn btn-outline-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var defaultLat = {{ site.lat or 20.5937 }};
        var defaultLng = {{ site.lng or 78.9629 }};
        
        var map = L.map('map').setView([defaultLat, defaultLng], 10);
        
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);
        
        var marker = L.marker([defaultLat, defaultLng]).addTo(map);
        
        map.on('click', function(e) {
            var lat = e.latlng.lat;
            var lng = e.latlng.lng;
            
            document.getElementById('lat').value = lat.toFixed(6);
            document.getElementById('lng').value = lng.toFixed(6);
            
            marker.setLatLng(e.latlng);
        });
    });
</script>
{% endblock %}
