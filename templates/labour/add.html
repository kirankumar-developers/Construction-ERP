{% extends "base.html" %}

{% block title %}Register Labour - Construction ERP{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="h3">Register Labour</h1>
    <p class="text-muted">Enroll a new construction worker in the database</p>
</div>

<div class="row">
    <div class="col-md-6">
        <div class="table-card">
            <form method="POST" action="{{ url_for('labour.add') }}">
                <div class="row g-3">
                    <div class="col-md-12">
                        <label for="name" class="form-label">Full Name</label>
                        <input type="text" name="name" id="name" class="form-control" placeholder="Labour Name" required>
                    </div>
                    
                    <div class="col-md-12">
                        <label for="category" class="form-label">Labour Category</label>
                        <select name="category" id="category" class="form-select" required>
                            <option value="Mason">Mason</option>
                            <option value="Carpenter">Carpenter</option>
                            <option value="Electrician">Electrician</option>
                            <option value="Plumber">Plumber</option>
                            <option value="Painter">Painter</option>
                            <option value="Helper">Helper</option>
                            <option value="Operator">Operator</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                    
                    <div class="col-md-12">
                        <label for="project_id" class="form-label">Project Assignment</label>
                        <select name="project_id" id="project_id" class="form-select" required>
                            <option value="">Select Project</option>
                            {% for p in projects %}
                            <option value="{{ p._id }}">{{ p.name }}</option>
                            {% endfor %}
                        </select>
                    </div>

                    <div class="col-md-12">
                        <label for="site_id" class="form-label">Site Assignment</label>
                        <select name="site_id" id="site_id" class="form-select" required>
                            <option value="">Select Site</option>
                            {% for s in sites %}
                            <option value="{{ s._id }}">{{ s.name }} ({{ s.site_code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    
                    <div class="col-md-12">
                        <label for="daily_wage" class="form-label">Daily Wage Rate ($)</label>
                        <input type="number" step="0.01" name="daily_wage" id="daily_wage" class="form-control" placeholder="0.00" required>
                    </div>
                    
                    <div class="col-md-12 text-end mt-4">
                        <a href="{{ url_for('labour.index') }}" class="btn btn-outline-secondary me-2">Cancel</a>
                        <button type="submit" class="btn btn-primary">Register Labour</button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
