{% extends "base.html" %}

{% block title %}Edit Project Manager - Construction ERP{% endblock %}

{% block content %}
<div class="mb-4">
    <h1 class="h3">Edit Project Manager</h1>
    <p class="text-muted">Modify Project Manager account and profile information</p>
</div>

<div class="row">
    <div class="col-md-8">
        <div class="table-card p-4">
            <form method="POST" action="{{ url_for('project_managers.edit', manager_id=manager._id) }}">
                <h5 class="mb-3 border-bottom pb-2">Account Details</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="name" class="form-label">Full Name <span class="text-danger">*</span></label>
                        <input type="text" name="name" id="name" class="form-control" value="{{ manager.name }}" required>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label">Email Address (Login) <span class="text-danger">*</span></label>
                        <input type="email" name="email" id="email" class="form-control" value="{{ manager.email }}" required autocomplete="username">
                    </div>
                    <div class="col-md-6">
                        <label for="password" class="form-label">New Password</label>
                        <input type="password" name="password" id="password" class="form-control" placeholder="Leave blank to keep unchanged" autocomplete="new-password">
                    </div>
                    <div class="col-md-6">
                        <label for="confirm_password" class="form-label">Confirm New Password</label>
                        <input type="password" name="confirm_password" id="confirm_password" class="form-control" placeholder="Leave blank to keep unchanged" autocomplete="new-password">
                    </div>
                </div>

                <h5 class="mb-3 border-bottom pb-2">Profile Details</h5>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="employee_id" class="form-label">Employee ID</label>
                        <input type="text" name="employee_id" id="employee_id" class="form-control" value="{{ manager.employee_id }}">
                    </div>
                    <div class="col-md-6">
                        <label for="department" class="form-label">Department</label>
                        <input type="text" name="department" id="department" class="form-control" value="{{ manager.department }}">
                    </div>
                    <div class="col-md-6">
                        <label for="phone" class="form-label">Phone Number</label>
                        <input type="text" name="phone" id="phone" class="form-control" value="{{ manager.phone }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Role</label>
                        <input type="text" class="form-control" value="Project Manager" readonly disabled>
                    </div>
                </div>

                <div class="text-end">
                    <a href="{{ url_for('project_managers.index') }}" class="btn btn-outline-secondary me-2">Cancel</a>
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
